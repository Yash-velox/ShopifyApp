# Environment profile: Image-Enhancement-Prod
# Public host: https://aiapp.aonegnd.com (nginx + Let's Encrypt → Node :3000).
# Prefer relative /webhooks/* so they hit Node on the app host (Node forwards to FastAPI).

client_id = "fa031d04375a4bfc4791e96db549ee17"
name = "Image-Enhancement-Prod"
application_url = "https://aiapp.aonegnd.com"
embedded = true

[access_scopes]
scopes = "write_products,read_products,write_files,read_files,write_metaobjects,write_metaobject_definitions"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/create"
  topics = [ "products/create" ]

[auth]
redirect_urls = [
  "https://aiapp.aonegnd.com/auth/callback",
  "https://aiapp.aonegnd.com/auth/shopify/callback",
  "https://aiapp.aonegnd.com/api/auth/callback"
]

# Optional app proxy; primary UI APIs use /backend-api on the same app host.
[app_proxy]
url = "https://aiapp.aonegnd.com"
subpath = "image-enhancement"
prefix = "apps"

[build]
automatically_update_urls_on_dev = false
