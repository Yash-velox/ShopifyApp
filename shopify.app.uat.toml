# Environment profile: Image-Enhancement-UAT
# Fill client_id with this Partner app's Client ID, then run: bash scripts/switch-app-env.sh
# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# AWS UAT: domain HTTPS → nginx → Node :3000; browser APIs via same-origin /backend-api.
# Prefer relative /webhooks/* so they hit Node on the app host (Node forwards to FastAPI).
# Public host: https://aiapp-uat.aonegnd.com (no ngrok / Cloudflare).

client_id = "65b3b854ab6b0345b1848f08e2b92149"
name = "Image-Enhancement-UAT"
application_url = "https://aiapp-uat.aonegnd.com"
embedded = true

[access_scopes]
# Start with products; expand for files/images when wiring SOW features
scopes = "write_products,read_products,write_files,read_files,write_metaobjects,write_metaobject_definitions"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

[auth]
redirect_urls = [
  "https://aiapp-uat.aonegnd.com/auth/callback",
  "https://aiapp-uat.aonegnd.com/auth/shopify/callback",
  "https://aiapp-uat.aonegnd.com/api/auth/callback"
]

# Optional app proxy; primary UI APIs use /backend-api on the same app host.
[app_proxy]
url = "https://aiapp-uat.aonegnd.com"
subpath = "image-enhancement"
prefix = "apps"

[build]
automatically_update_urls_on_dev = false
